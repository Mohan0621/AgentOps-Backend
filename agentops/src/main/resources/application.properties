spring.application.name=agentops

# Database Configuration with Environment Variable Overrides
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# open-in-view disabled to prevent lazy loading issues in web layer
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:}

# AI Provider Configuration (groq / gemini)
ai.provider=${AI_PROVIDER:groq}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
