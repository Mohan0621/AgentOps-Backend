<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    user-select: none;
    background:
      linear-gradient(to bottom, #E5F2FF 0%, rgba(229,242,255,0) 14%),
      radial-gradient(ellipse 220% 100% at 50% 100%,
        #FF8C51 0%,
        #FF897F 6%,
        #F489AD 15%,
        #E388F2 26%,
        #96CBFA 46%,
        #CFE6FC 62%,
        #E5F2FF 78%,
        #FFFFFF 100%
      );
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<script>
(function() {
  const canvas = document.getElementById('globe');
  const ctx = canvas.getContext('2d');
  const auraCanvas = document.createElement('canvas');
  const auraCtx = auraCanvas.getContext('2d');
  let width = 0, height = 0, dpr = 1;
  let paused = false;
  let rafId = 0;

  window.setGlobePaused = function(flag) {
    const next = Boolean(flag);
    if (paused === next) return;
    paused = next;
    if (!paused && !rafId) {
      lastPaint = performance.now();
      rafId = requestAnimationFrame(frame);
    }
  };

  function rebuildAura(cx, cy, radius) {
    auraCanvas.width = Math.max(1, width);
    auraCanvas.height = Math.max(1, height);
    auraCtx.clearRect(0, 0, width, height);
    const aura = auraCtx.createRadialGradient(cx, cy, radius * 0.25, cx, cy, radius * 1.32);
    aura.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
    aura.addColorStop(0.55, 'rgba(207, 105, 224, 0.14)');
    aura.addColorStop(0.85, 'rgba(255, 140, 81, 0.12)');
    aura.addColorStop(1, 'rgba(255, 255, 255, 0)');
    auraCtx.fillStyle = aura;
    auraCtx.beginPath();
    auraCtx.arc(cx, cy, radius * 1.32, 0, Math.PI * 2);
    auraCtx.fill();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cx = width * 0.5;
    const cy = height * 0.62;
    const radius = Math.min(width * 0.36, height * 0.52);
    rebuildAura(cx, cy, radius);
  }
  window.addEventListener('resize', resize);
  resize();

  const DEG = Math.PI / 180;
  // Fibonacci sphere dots for subtle glowing lattice like serko.ai's WebGL hero globe
  const dots = [];
  const N = 240;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    dots.push({ x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r });
  }

  // Simulated distributed telemetry hubs & routes
  const hubs = [
    { name: 'us-west', lat: 37.77, lon: -122.41, color: '#1B98F2' },
    { name: 'us-east', lat: 40.71, lon: -74.00,  color: '#CF69E0' },
    { name: 'eu-west', lat: 51.50, lon: -0.12,   color: '#F56293' },
    { name: 'eu-cent', lat: 50.11, lon: 8.68,    color: '#FF635C' },
    { name: 'ap-south',lat: 12.97, lon: 77.59,   color: '#FF8C51' },
    { name: 'ap-east', lat: 35.67, lon: 139.65,  color: '#1B98F2' }
  ];

  const routes = [
    [0, 1], [1, 2], [2, 3], [3, 4], [4, 5], [0, 4]
  ];

  function latLonToVec(lat, lon) {
    const phi = (90 - lat) * DEG;
    const theta = (lon + 180) * DEG;
    return {
      x: -Math.sin(phi) * Math.cos(theta),
      y: Math.cos(phi),
      z: Math.sin(phi) * Math.sin(theta)
    };
  }

  function rotateVec(v, rotY, rotX) {
    // Rotate around Y
    const cy = Math.cos(rotY), sy = Math.sin(rotY);
    const x1 = v.x * cy - v.z * sy;
    const z1 = v.x * sy + v.z * cy;
    // Tilt around X
    const cx = Math.cos(rotX), sx = Math.sin(rotX);
    const y2 = v.y * cx - z1 * sx;
    const z2 = v.y * sx + z1 * cx;
    return { x: x1, y: y2, z: z2 };
  }

  let t = 0;
  let lastPaint = performance.now();
  function frame(now) {
    rafId = 0;
    if (paused) return;
    if (now - lastPaint < 30) {
      rafId = requestAnimationFrame(frame);
      return;
    }
    const dt = Math.min(0.08, (now - lastPaint) / 1000);
    lastPaint = now;
    t += dt * 0.48;
    ctx.clearRect(0, 0, width, height);

    const cx = width * 0.5;
    // Place sphere center slightly lower just like Serko's rising horizon globe
    const cy = height * 0.62;
    const radius = Math.min(width * 0.36, height * 0.52);

    const rotY = t * 0.48;
    const rotX = -0.32;

    // 1. Cached atmospheric radial aura halo around globe
    ctx.drawImage(auraCanvas, 0, 0, width, height);

    // 2. Crisp translucent outer rim ring
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();

    // 3. Rotating latitude / longitude wireframe arcs
    ctx.lineWidth = 1.05;
    for (let lat = -60; lat <= 60; lat += 30) {
      ctx.beginPath();
      let started = false;
      for (let lon = -180; lon <= 180; lon += 10) {
        const p = rotateVec(latLonToVec(lat, lon), rotY, rotX);
        if (p.z > -0.05) {
          const sx = cx + p.x * radius;
          const sy = cy - p.y * radius;
          if (!started) { ctx.moveTo(sx, sy); started = true; }
          else ctx.lineTo(sx, sy);
        } else {
          started = false;
        }
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.stroke();
    }

    for (let lon = 0; lon < 180; lon += 30) {
      ctx.beginPath();
      let started = false;
      for (let a = 0; a <= 360; a += 10) {
        const rad = a * DEG;
        const vec = {
          x: Math.cos(rad) * Math.cos(lon * DEG),
          y: Math.sin(rad),
          z: Math.cos(rad) * Math.sin(lon * DEG)
        };
        const p = rotateVec(vec, rotY, rotX);
        if (p.z > -0.05) {
          const sx = cx + p.x * radius;
          const sy = cy - p.y * radius;
          if (!started) { ctx.moveTo(sx, sy); started = true; }
          else ctx.lineTo(sx, sy);
        } else {
          started = false;
        }
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
      ctx.stroke();
    }

    // 4. Fibonacci lattice micro-dots
    for (let i = 0; i < dots.length; i++) {
      const p = rotateVec(dots[i], rotY, rotX);
      if (p.z > -0.15) {
        const alpha = Math.max(0.12, Math.min(0.85, (p.z + 0.15) * 0.72));
        const sx = cx + p.x * radius;
        const sy = cy - p.y * radius;
        ctx.fillStyle = `rgba(27, 152, 242, ${alpha * 0.65})`;
        ctx.beginPath();
        ctx.arc(sx, sy, p.z > 0.4 ? 1.8 : 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 5. Animated glowing telemetry arcs & traveling pulse packets between hubs
    routes.forEach((pair, idx) => {
      const va = latLonToVec(hubs[pair[0]].lat, hubs[pair[0]].lon);
      const vb = latLonToVec(hubs[pair[1]].lat, hubs[pair[1]].lon);
      const pts = [];
      const steps = 22;
      for (let s = 0; s <= steps; s++) {
        const f = s / steps;
        let mx = va.x * (1 - f) + vb.x * f;
        let my = va.y * (1 - f) + vb.y * f;
        let mz = va.z * (1 - f) + vb.z * f;
        const len = Math.hypot(mx, my, mz) || 1;
        const lift = 1 + Math.sin(f * Math.PI) * 0.18;
        mx = (mx / len) * lift;
        my = (my / len) * lift;
        mz = (mz / len) * lift;
        const rp = rotateVec({ x: mx, y: my, z: mz }, rotY, rotX);
        pts.push({ sx: cx + rp.x * radius, sy: cy - rp.y * radius, z: rp.z });
      }

      const midZ = pts[Math.floor(steps / 2)].z;
      if (midZ > -0.25) {
        const grad = ctx.createLinearGradient(pts[0].sx, pts[0].sy, pts[steps].sx, pts[steps].sy);
        grad.addColorStop(0, 'rgba(27, 152, 242, 0.90)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.95)');
        grad.addColorStop(1, 'rgba(255, 140, 81, 0.92)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        pts.forEach((pt, k) => {
          if (k === 0) ctx.moveTo(pt.sx, pt.sy);
          else ctx.lineTo(pt.sx, pt.sy);
        });
        ctx.stroke();

        // Moving luminous packet orb along trajectory
        const progress = ((t * 0.55 + idx * 0.21) % 1);
        const orbPt = pts[Math.min(steps, Math.floor(progress * steps))];
        if (orbPt && orbPt.z > -0.1) {
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(orbPt.sx, orbPt.sy, 3.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(27, 152, 242, 0.42)';
          ctx.beginPath();
          ctx.arc(orbPt.sx, orbPt.sy, 9.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    });

    // 6. Hub node markers
    hubs.forEach((h, idx) => {
      const rp = rotateVec(latLonToVec(h.lat, h.lon), rotY, rotX);
      if (rp.z > 0) {
        const sx = cx + rp.x * radius;
        const sy = cy - rp.y * radius;
        const pulse = 5 + Math.sin(t * 4 + idx) * 2;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.arc(sx, sy, pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.arc(sx, sy, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
